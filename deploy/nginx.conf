# ---------------------------------------------------------------------------
# Конфиг nginx для статического учебника.
# Плейсхолдер __SERVER_NAME__ заменяет deploy-скрипт.
# ---------------------------------------------------------------------------

# Замени на IP, если нет домена:
#   server_name 10.0.0.5;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root /var/www/uchebnik;
    index index.html;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    # учебник читают в основном локально, клиппинга нет
    server_tokens off;
    client_max_body_size 2m;

    # --- базовая безопасность -------------------------------------------
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    # CSP отключён: учебник не грузит внешних ресурсов, но строгий CSP
    # ломает inline-скрипты отрисовки дашбордов

    # --- сжатие ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # --- статика с длинным кэшем ----------------------------------------
    # содержимое сайта версионируется датой сборки, поэтому кэш можно держать долго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- страницы лекций: короткий кэш, чтобы правки были видны сразу --
    location /lectures/ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # --- поиск по имени лекции ------------------------------------------
    # /lectures/devops/16-prometheus  ->  .html
    location ~ ^(/lectures/.+)/$ {
        try_files $1.html $1/index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    # 404 без полного оформления: поиск клиента пошлёт обычный index.html
    error_page 404 /index.html;

    # листинг каталогов выключен принципиально
    autoindex off;

    access_log /var/log/nginx/uchebnik.access.log;
    error_log  /var/log/nginx/uchebnik.error.log warn;

    location ~ /\.(?!well-known) {
        deny all;            # не отдаём .git и прочее
    }
}