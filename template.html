<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Учебник DevOps &amp; MLOps</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="stylesheet" href="{{BASE}}assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9670;</text></svg>">
</head>
<body>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Меню">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="logo" href="{{BASE}}index.html">
    <span class="logo-mark">&#9670;</span>
    <span class="logo-text">DevOps <b>&amp;</b> MLOps<em>учебник</em></span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Поиск по курсу…" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <div class="topbar-right">
    <div class="progress-mini" title="Прогресс курса">
      <div class="pm-ring"><svg viewBox="0 0 36 36"><circle class="pm-bg" cx="18" cy="18" r="15.5"/><circle class="pm-fg" cx="18" cy="18" r="15.5" id="pmFg"/></svg><span id="pmPct">0%</span></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">
      <svg viewBox="0 0 24 24" class="ico-moon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <nav class="curriculum" id="curriculum"></nav>
    <div class="side-foot">
      <div class="prog-bar"><div id="progFill"></div></div>
      <div class="prog-text" id="progText">0 из 0 пройдено</div>
      <div class="side-links">
        <button class="link-btn" id="resetProgress">Сбросить прогресс</button>
        <a href="{{BASE}}index.html">Главная</a>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="crumbs">
      <a href="{{BASE}}index.html">Учебник</a>
      <span class="sep">/</span>
      <a href="{{BASE}}lectures/index.html">{{TRACK_NAME}}</a>
      <span class="sep">/</span>
      <span class="crumb-mod">{{MODULE}}</span>
    </div>

    {{HERO}}
    <article class="content{{ARTCLASS}}">
      <div class="lesson-head">
        <h1>{{TITLE}}</h1>
        <p class="lead">{{SUMMARY}}</p>
        <div class="meta">{{META}}</div>
        {{TAGS}}
      </div>

      {{TOC}}

      <div class="prose" id="prose">{{CONTENT}}</div>

      {{PRACTICE}}

      {{TRAINER}}

      <div class="done-block">
        <button class="done-btn" id="doneBtn" data-slug="{{SLUG}}">
          <span class="db-check">✓</span><span class="db-text">Отметить пройденной</span>
        </button>
      </div>

      <nav class="lesson-nav">
        {{PREV}}
        {{NEXT}}
      </nav>

      <footer class="foot">
        <div>Учебник DevOps &amp; MLOps · сборка {{BUILD}}</div>
      </footer>
    </article>
  </main>
</div>

<button class="totop" id="toTop" aria-label="Наверх">↑</button>

<script>window.BASE = "{{BASE}}"; window.SLUG = "{{SLUG}}";</script>
<script>window.CURRICULUM = {{CURICULUM_JSON}};</script>
<script>window.SEARCH_INDEX = {{SEARCH_JSON}};</script>
<script src="{{BASE}}assets/app.js"></script>
</body>
</html>
